
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-sans); }
  .form-wrap { max-width: 520px; margin: 0 auto; padding: 1.5rem 1rem; }
  .logo-bar { background: #1a56c4; border-radius: var(--border-radius-lg); padding: 1.25rem 1.5rem; margin-bottom: 1.5rem; text-align: center; }
  .logo-bar h1 { color: #fff; font-size: 18px; font-weight: 500; }
  .logo-bar p { color: rgba(255,255,255,0.8); font-size: 13px; margin-top: 4px; }
  .badge-row { display: flex; gap: 8px; justify-content: center; margin-top: 10px; flex-wrap: wrap; }
  .badge { background: rgba(255,255,255,0.2); color: #fff; font-size: 12px; padding: 3px 10px; border-radius: 20px; }
  .card { background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); padding: 1.25rem 1.5rem; margin-bottom: 1rem; }
  .field { margin-bottom: 1rem; }
  .field:last-child { margin-bottom: 0; }
  label { display: block; font-size: 13px; color: var(--color-text-secondary); margin-bottom: 6px; }
  input, select { width: 100%; padding: 9px 12px; border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-md); font-size: 14px; background: var(--color-background-primary); color: var(--color-text-primary); }
  input:focus, select:focus { outline: none; border-color: #1a56c4; box-shadow: 0 0 0 3px rgba(26,86,196,0.12); }
  .checkbox-group { display: flex; flex-direction: column; gap: 8px; }
  .checkbox-item { display: flex; align-items: center; gap: 10px; cursor: pointer; padding: 8px 10px; border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-md); transition: background 0.15s; }
  .checkbox-item:hover { background: var(--color-background-secondary); }
  .checkbox-item input[type=checkbox] { width: 16px; height: 16px; accent-color: #1a56c4; cursor: pointer; }
  .checkbox-item span { font-size: 14px; color: var(--color-text-primary); }
  .submit-btn { width: 100%; padding: 12px; background: #1a56c4; color: #fff; border: none; border-radius: var(--border-radius-md); font-size: 15px; font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: background 0.15s; }
  .submit-btn:hover { background: #1445a3; }
  .success-box { display: none; background: var(--color-background-success); border: 0.5px solid var(--color-border-success); border-radius: var(--border-radius-lg); padding: 1.5rem; text-align: center; }
  .success-box i { font-size: 36px; color: var(--color-text-success); }
  .success-box h3 { font-size: 16px; font-weight: 500; color: var(--color-text-success); margin-top: 8px; }
  .success-box p { font-size: 13px; color: var(--color-text-secondary); margin-top: 6px; }
  .footer-note { text-align: center; font-size: 12px; color: var(--color-text-tertiary); margin-top: 1rem; }
  .section-title { font-size: 13px; font-weight: 500; color: var(--color-text-secondary); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.05em; }
</style>

<div class="form-wrap">
  <div class="logo-bar">
    <h1>Cyber Village Academy of IT</h1>
    <p>Free 2-Day Session — Register Now</p>
    <div class="badge-row">
      <span class="badge"><i class="ti ti-brand-python" aria-hidden="true"></i> Python</span>
      <span class="badge"><i class="ti ti-cpu" aria-hidden="true"></i> Artificial Intelligence</span>
      <span class="badge"><i class="ti ti-code" aria-hidden="true"></i> Web Development</span>
    </div>
  </div>

  <div class="card" id="form-card">
    <div class="field">
      <label for="fname">Full Name</label>
      <input type="text" id="fname" placeholder="Enter your full name" />
    </div>
    <div class="field">
      <label for="phone">Phone / WhatsApp Number</label>
      <input type="tel" id="phone" placeholder="e.g. 0300-1234567" />
    </div>
    <div class="field">
      <label for="city">City / Area</label>
      <input type="text" id="city" placeholder="e.g. Daharki, Ghotki" />
    </div>
    <div class="field">
      <label for="age">Age</label>
      <input type="number" id="age" placeholder="e.g. 18" min="10" max="60" />
    </div>
    <div class="field">
      <p class="section-title">Course interest</p>
      <div class="checkbox-group">
        <label class="checkbox-item"><input type="checkbox" value="Python" /> <span>Python</span></label>
        <label class="checkbox-item"><input type="checkbox" value="Artificial Intelligence (AI)" /> <span>Artificial Intelligence (AI)</span></label>
        <label class="checkbox-item"><input type="checkbox" value="Web Development" /> <span>Web Development</span></label>
        <label class="checkbox-item"><input type="checkbox" value="All Three" /> <span>All Three</span></label>
      </div>
    </div>
    <div class="field" style="margin-top:1.25rem;">
      <button class="submit-btn" onclick="submitForm()">
        <i class="ti ti-brand-whatsapp" aria-hidden="true"></i>
        Register via WhatsApp
      </button>
    </div>
  </div>

  <div class="success-box" id="success-box">
    <i class="ti ti-circle-check" aria-hidden="true"></i>
    <h3>Registration sent!</h3>
    <p>Your details have been sent to the academy via WhatsApp.</p>
  </div>

  <p class="footer-note">Opposite Civil Hospital, Daharki &nbsp;|&nbsp; 0307-3666685</p>
</div>

<script>
function submitForm() {
  const name = document.getElementById('fname').value.trim();
  const phone = document.getElementById('phone').value.trim();
  const city = document.getElementById('city').value.trim();
  const age = document.getElementById('age').value.trim();
  const checked = [...document.querySelectorAll('.checkbox-group input:checked')].map(c => c.value);

  if (!name || !phone) {
    alert('Please enter your name and phone number.');
    return;
  }

  const courses = checked.length ? checked.join(', ') : 'Not specified';
  const msg = `*New Registration — Free Session*\n\n` +
    `*Name:* ${name}\n` +
    `*Phone:* ${phone}\n` +
    `*City:* ${city || 'Not provided'}\n` +
    `*Age:* ${age || 'Not provided'}\n` +
    `*Interested In:* ${courses}`;

  const waNumber = '923252589715';
  const url = `https://wa.me/${waNumber}?text=${encodeURIComponent(msg)}`;
  window.open(url, '_blank');

  document.getElementById('form-card').style.display = 'none';
  document.getElementById('success-box').style.display = 'block';
}
</script>
